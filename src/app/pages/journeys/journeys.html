<style>
  .root {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  app-toolbar {
    flex: 0 0 auto;
  }
</style>

<div class="root">
  <app-toolbar></app-toolbar>
  @for (mountain of mountains(); track mountain.src) {
    <p>{{ mountain.photographer }}</p>
    <img [src]="mountain.src.original" [alt]="mountain.alt" style="width: 50px" />
  } @empty {
    <li>There are no items.</li>
  }
</div>
