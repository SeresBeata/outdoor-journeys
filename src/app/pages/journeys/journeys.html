<style>
  .loader-container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  app-toolbar {
    flex: 0 0 auto;
  }

  .truncated-text {
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mat-column-photographer_url {
    max-width: 200px;
  }
</style>

<div>
  <app-toolbar></app-toolbar>
  <div class="container">
    @if (mountains().length > 0) {
      <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
      </mat-paginator>
    } @else {
      <div class="loader-container">
        <span class="loader"></span>
      </div>
    }
  </div>
</div>
