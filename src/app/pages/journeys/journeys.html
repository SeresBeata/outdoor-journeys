<style>
  .loader-container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  app-toolbar {
    flex: 0 0 auto;
  }

  .truncated-text {
    white-space: nowrap;
    width: 50%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>

<div>
  <app-toolbar></app-toolbar>
  @if (mountains().length > 0) {
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!-- Image -->
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Image</th>

        <td mat-cell *matCellDef="let mountain">
          <img [src]="mountain.src.tiny" [alt]="mountain.alt" width="100" />
        </td>
      </ng-container>

      <!-- Alt text -->
      <ng-container matColumnDef="alt">
        <th mat-header-cell *matHeaderCellDef>Description</th>

        <td mat-cell *matCellDef="let mountain">
          {{ mountain.alt }}
        </td>
      </ng-container>

      <!-- Photographer -->
      <ng-container matColumnDef="photographer">
        <th mat-header-cell *matHeaderCellDef>Photographer</th>

        <td mat-cell *matCellDef="let mountain">
          {{ mountain.photographer }}
        </td>
      </ng-container>

      <!-- Photographer URL -->
      <ng-container matColumnDef="photographer_url">
        <th mat-header-cell *matHeaderCellDef>Link</th>

        <td mat-cell *matCellDef="let mountain">
          <div class="truncated-text">
            <a href="{{ mountain.photographer_url }}"> {{ mountain.photographer_url }} </a>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
    </mat-paginator>
  } @else {
    <div class="loader-container">
      <span class="loader"></span>
    </div>
  }
</div>
