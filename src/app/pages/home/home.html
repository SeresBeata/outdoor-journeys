<style>
  .root {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  app-toolbar {
    flex: 0 0 auto;
  }

  .container-home {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }

  .section-style {
    height: 100%;
    scroll-snap-align: start;
  }

  .example-card {
    margin: 5px;
    max-width: 400px;
    min-height: 300px;
  }

  .example-card-footer {
    padding: 16px;
  }

  .cards-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
  }

  .card__avatar-wrapper {
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  .card__avatar {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    border-radius: 50%;
    font-size: 20px;
    font-weight: 700;
    background-color: var(--mat-sys-primary-container);
  }

  @media all and (max-width: 1250px) {
    .cards-wrapper {
      flex-direction: column;
    }

    .example-card {
      max-width: 100%;
      max-height: 260px;
    }
  }
</style>

<div class="root">
  <app-toolbar></app-toolbar>
  <div class="container-home" (scroll)="onScroll($event)">
    <app-hero></app-hero>
    <app-about></app-about>
    <section class="section-style">
      <div class="cards-wrapper">
        @for (post of posts(); track post) {
          <mat-card class="example-card" appearance="outlined">
            <mat-card-header>
              <div class="card__avatar-wrapper">
                <div class="card__avatar">
                  {{ post.username.charAt(0) }}
                </div>
              </div>
              <mat-card-title style="padding-top: 20px">{{ post.username }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <p>{{ post.body }}</p>
            </mat-card-content>
            <mat-card-footer class="example-card-footer">
              <mat-chip-set aria-label="Chihuahua traits">
                <mat-chip>{{ post.firstName }}</mat-chip>
                <mat-chip>{{ post.lastName }}</mat-chip>
              </mat-chip-set>
            </mat-card-footer>
          </mat-card>
        } @empty {
          <div>No Comments</div>
        }
      </div>
    </section>
    <section class="section-style">Impressum</section>
    <section class="section-style"><app-carousel-section></app-carousel-section></section>
    <section class="section-style">
      Weather
      <app-weather-animation></app-weather-animation>
    </section>
  </div>
</div>
