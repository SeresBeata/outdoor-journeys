<style>
  .root {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  app-toolbar {
    flex: 0 0 auto;
  }

  .container-home {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }

  .section-style {
    height: 100%;
    scroll-snap-align: start;
  }
</style>

<div class="root">
  <app-toolbar></app-toolbar>
  <div class="container-home" (scroll)="onScroll($event)">
    <app-hero></app-hero>
    <app-about></app-about>
    <app-reviews [posts]="posts()"></app-reviews>
    <section class="section-style">Impressum</section>
    <section class="section-style"><app-carousel-section></app-carousel-section></section>
    <section class="section-style">
      Weather
      <app-weather-animation></app-weather-animation>
    </section>
  </div>
</div>
