<style>
  .root {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .container-home {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
</style>

<div class="root">
  <app-toolbar></app-toolbar>
  <div class="container-home" (scroll)="onScroll($event)">
    <app-hero></app-hero>
    <app-about></app-about>
    <app-reviews [posts]="posts()"></app-reviews>
    <app-carousel-section></app-carousel-section>
  </div>
</div>
