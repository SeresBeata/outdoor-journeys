<style>
  .section-style {
    height: 100%;
    scroll-snap-align: start;
  }

  .about-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
  }

  @supports (display: grid) {
    .about-main-section__grid {
      width: 100%;
      padding: 15px;
      margin-bottom: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
      text-align: start;
      background-color: var(--mat-sys-primary-container);
      border-radius: 5px;
    }

    .about-main-section__grid-item-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      height: 100%;
    }

    .about-main-section__grid-item {
      background-color: var(--mat-sys-surface);
      padding: 10px;
      display: flex;
      justify-content: flex-start;
      flex-wrap: wrap;
      align-content: flex-start;
    }

    .about-main-section__grid-item:nth-of-type(1) {
      grid-column: 2 / 4;
      border-top-left-radius: 5px;
    }

    .about-main-section__grid-item:nth-of-type(3) {
      grid-row: 1 / 3;
      border-top-right-radius: 5px;
      align-content: center;
      border-bottom-right-radius: 5px;
      background-repeat: no-repeat;
      background-size: cover;
      min-height: 200px;
    }

    .about-main-section__grid-item:nth-of-type(4) {
      border-bottom-left-radius: 5px;
    }

    .about-main-section__grid-item:nth-of-type(5) {
      grid-column: 3 / 5;
    }

    @media all and (max-width: 992px) {
      .about-main-section__grid {
        grid-template-columns: 1fr 1fr;
      }

      .about-main-section__grid-item {
        align-content: flex-start;
      }

      .about-main-section__grid-item:nth-of-type(1) {
        grid-column: 1 / 2;
        grid-row: 1 / 2;
      }

      .about-main-section__grid-item:nth-of-type(2) {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        border-top-right-radius: 5px;
      }

      .about-main-section__grid-item:nth-of-type(3) {
        grid-column: span 2;
        grid-row: 2 /3;
        border-radius: 0;
      }

      .about-main-section__grid-item:nth-of-type(4) {
        grid-column: 1 /2;
        grid-row: 3 / 4;
      }

      .about-main-section__grid-item:nth-of-type(5) {
        grid-column: 2 / 3;
        grid-row: 3 / 4;
        border-bottom-right-radius: 5px;
      }
    }

    @media all and (max-width: 480px) {
      .about-main-section__grid {
        grid-template-columns: 1fr;
      }

      .about-main-section__grid-item:nth-of-type(1) {
        grid-column: 1 / 2;
        grid-row: 1 / 2;
        border-top-right-radius: 5px;
      }

      .about-main-section__grid-item:nth-of-type(2) {
        grid-column: 1 / 2;
        grid-row: 2 / 3;
        border-radius: 0;
      }

      .about-main-section__grid-item:nth-of-type(3) {
        grid-column: 1 / 2;
        grid-row: 3 / 4;
      }

      .about-main-section__grid-item:nth-of-type(4) {
        grid-column: 1 /2;
        grid-row: 4 / 5;
        border-radius: 0;
      }

      .about-main-section__grid-item:nth-of-type(5) {
        grid-column: 1 / 2;
        grid-row: 5 / 6;
        border-bottom-left-radius: 5px;
      }
    }

    @media (max-height: 992px) and (max-width: 1000px) {
      .about-main-section__grid {
        margin: 0;
        padding: 5px;
        gap: 5px;
      }

      .about-main-section__grid-item {
        padding: 8px;
      }

      h3 {
        font-size: medium;
      }

      p {
        font-size: x-small;
        margin: 0;
        line-height: 1.5;
      }

      .about-main-section__grid-item:nth-of-type(3) {
        min-height: 200px;
      }

      .mdc-button {
        margin-top: 5px;
        height: 30px;
      }
    }

    @media (max-height: 670px) {
      .about-main-section__grid {
        margin: 0;
        padding: 5px;
        gap: 5px;
      }

      .about-main-section__grid-item {
        padding: 8px;
      }

      h3 {
        font-size: medium;
      }

      p {
        font-size: x-small;
        margin: 0;
        line-height: 1.5;
      }

      .about-main-section__grid-item:nth-of-type(3) {
        height: 100px;
        min-height: 20px;
      }

      .mdc-button {
        margin-top: 5px;
        height: 30px;
      }
    }
  }
</style>

<section class="section-style">
  <div class="container about-wrapper">
    <div class="about-main-section__grid">
      @for (item of gridItems; track item) {
        <div
          class="about-main-section__grid-item"
          [style.background-image]="'url(' + item.imgUrl + ')'"
        >
          <div class="about-main-section__grid-item-wrapper">
            <h3>{{ item.title }}</h3>
            <p>{{ item.p }}</p>
            @if (item.link) {
              <a matButton="tonal" href="{{ item.link }}">{{ item.linkText }}</a>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
