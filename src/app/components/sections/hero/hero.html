<style>
  .section-style {
    height: 100%;
    scroll-snap-align: start;
  }

  .hero {
    position: relative;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  .parallax {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .hero h1 {
    position: absolute;
    z-index: 0;
    color: white;
    text-transform: uppercase;
    font-size: clamp(3.5rem, 10vw, 500px);
    will-change: transform, opacity;
    margin-bottom: 150px;
    text-shadow: -3px -5px 8px #0e0d0d;
  }
</style>

<section class="hero section-style">
  <img src="assets/hero/sky.png" class="parallax sky" data-speed="0.1" alt="" />
  <img src="assets/hero/mountain.png" class="parallax mountain" data-speed="0.3" alt="" />
  <h1>Outdoor</h1>
  <img src="assets/hero/forest.png" class="parallax forest" data-speed="0.3" alt="" />
  <img src="assets/hero/fog.png" class="parallax fog" data-speed="0.5" alt="" />
</section>
